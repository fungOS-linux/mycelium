[package]
name = "mycelium-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "mycelium control-plane CLI: talks to myceliumd over its Unix socket"

[features]
iroh-sync = ["myceliumd/iroh-sync", "dep:qrcode"]

[[bin]]
name = "mycelium"
path = "src/main.rs"

[[bin]]
name = "mycelium-https-forwarder"
path = "src/https_forwarder.rs"

[dependencies]
qrcode = { version = "0.14", default-features = false, optional = true }
mycelium-core.workspace = true
mycelium-driver-netgear-fastpath = { path = "../mycelium-driver-netgear-fastpath" }
myceliumd.workspace = true
mycelium-peer-protocol.workspace = true
fpl-resource-observation.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
tokio.workspace = true
axum = "0.8"
rand_core.workspace = true
sha2.workspace = true
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
ed25519-dalek.workspace = true
