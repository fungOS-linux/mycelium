[package]
name = "geode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Owner-local credential store: opaque secrets, explicit purposes, bounded leases"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
rand_core = { version = "0.6", features = ["getrandom"] }
aes-gcm = "0.10"
sha2.workspace = true
hmac = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS Keychain backend. Safe wrapper; the crate is macOS/iOS only, so the
# dependency (and the backend) are gated behind `cfg(target_os = "macos")`.
security-framework = "3.2"

[dev-dependencies]
serde_json.workspace = true
