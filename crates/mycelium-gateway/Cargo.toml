[package]
name = "mycelium-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Loopback Host-routed gateway for fungOS .myc service names"

[[bin]]
name = "mycelium-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.8"
fpl-resource-observation.workspace = true
futures-util = "0.3"
hyper-util.workspace = true
reqwest = { workspace = true, features = ["stream"] }
mycelium-dns-policy.workspace = true
mycelium-peer-protocol.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-rustls.workspace = true

[dev-dependencies]
rcgen = "0.13"
