[package]
name = "mycelium-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Loopback gateway for fungOS .myc capability routing"

[[bin]]
name = "mycelium-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.8"
hyper = { version = "1.11", default-features = false }
hyper-util = { version = "0.1", features = ["tokio"] }
mycelium-core.workspace = true
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "signal"] }
tokio-rustls = "0.26"
tower = "0.5"
